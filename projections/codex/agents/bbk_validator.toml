The envelope also requires `subject_ref`, `parent_ref`, `attempt_ref`, `summary`, `authority_and_effects_used`, `result`, `durable_handoff_refs`, and `smallest_valid_next_action`.

The closed `result` payload requires every field below:

- `parent_run_assignment_and_attempt` (STRUCTURED) — Exact `bbk_validator_orchestrator` parent, ReviewRun and assignment references, semantic attempt, physical invocation or session, reply route, budgets, predecessor or replacement identity, and current checkpoint or final-report reason.
- `subject_candidate_and_immutability` (STRUCTURED) — Exact governed subject and candidate identity, revision and digest, candidate manifest and content root, freeze or immutability receipt, predecessor and successor lineage, verified handoff, post-freeze mutation check, candidate read-only fence and any identity, integrity or staleness blocker.
- `baseline_and_prerequisite_eligibility` (STRUCTURED) — Applicable operating and execution baseline, execution or assurance-run authority, TerritoryExecutionBoundary, cohort, WorkUnits and prerequisite worker-quality attestation or explicit non-applicability; identity, currentness and eligibility checks without treating a parent summary as evidence.
- `assurance_charter_and_assertions` (STRUCTURED) — Current AssuranceContract and assignment identity, every assigned assertion, source trace, exact criterion, falsifier or threshold, applicability, acceptable and prohibited methods, required evidence, environment, blocking consequence, protected floor, independence, reuse, repair and revalidation rules, plus any contradiction or missing design.
- `context_and_completeness` (STRUCTURED) — ReviewContextManifest and context-pack identity and digest; included and retrieval-only objects; exclusions, omissions, redactions, generated summaries, source closure, shards, compiler and completeness; required missing or stale context and affected assertions.
- `criteria_timing_purpose_and_exposure` (STRUCTURED) — One allowed attempt purpose, one prior-findings visibility state, criteria commitment time, append-only exposure to worker narrative, prior findings, expected answers, deterministic results and other outcome-bearing evidence, and any post-exposure change that limits confirmation claims.
- `independence_facts` (STRUCTURED) — Producer, logical-role, physical-session, context-assembly, candidate-mutation, model, provider, method, tool, environment, data, consumer or device and organizational independence facts; required dimensions achieved or missing; and limitations on blind, replicated or confirmatory claims.
- `method_profile_tool_and_environment` (STRUCTURED) — Assigned method; profile identity, version, effective digest, router and procedure; tool, adapter and version; environment activation, fixtures, data, consumer, device or facility; credentials and endpoints; qualification, fallback and limitation; and any unapproved substitution attempt.
- `authority_effect_and_read_only_fence` (STRUCTURED) — Authority source and holder; allowed and prohibited filesystem, process, package, credential, network, service, database, device, facility and external-system effects; scratch or isolated-copy identity; pre-state, rollback, cleanup and actual effects used; and every denied, uncovered or unauthorized effect.
- `operations_and_evidence` (STRUCTURED) — Every material operation or observation with assertion link, sanitized argv or method, working context, tool and environment, inputs and fixtures, start and completion, output and raw carriers, EvidenceReceipt, trust class, coverage, redaction, freshness, dependency fingerprint, path/bytes/SHA-256 where material, reuse decision and limitations.
- `assertion_evaluations` (STRUCTURED_LIST) — One schema-valid evaluation for every assigned assertion using an allowed assertion status, exact evidence references, rationale, applicability, criterion, coverage and limitations. Preserve partial success without deriving the complete ReviewAggregate.
- `findings_and_nonfinding_states` (STRUCTURED) — Every immutable candidate or contract finding with exact source attempt, subject digest, affected assertions and objects, classification, severity, blocking state, expected and observed condition, reproduction, evidence, scope, probable impact, route, fingerprint and lifecycle; plus context, evidence, evaluator, tool, environment, authority, capacity and integrity states explicitly not represented as candidate findings.
- `outside_scope_and_parent_referrals` (STRUCTURED) — Every material outside-scope observation, requirement or architecture issue, assertion-design gap, authority question, candidate-repair implication, capability need or parent recharter request with exact evidence, affected objects and proposed owner, without broadening the current attempt.
- `cleanup_and_residuals` (STRUCTURED) — One allowed cleanup state plus scratch files, build outputs, caches, processes, packages, credentials, services, ports, locks, databases, networks, devices, facilities, workspaces and remote effects; rollback or quarantine, retained evidence, residual owner and any cleanup blocker.
- `continuation_and_recovery` (STRUCTURED) — Completed and remaining operations, exact checkpoint and evidence state, candidate and charter identity, criteria and exposure, method and environment, budgets consumed, same-attempt resume conditions, replacement or successor-attempt need, interruption evidence and smallest safe continuation action.
- `claims_established_and_not_established` (STRUCTURED) — Exact bounded claims supported by current assertion evaluations, material limitations and claims explicitly not established. State that this attempt does not derive the central aggregate, close findings, accept the candidate or risk, establish campaign or outcome completion, or grant release.
- `attempt_completion_state` (ENUM; COMPLETED, CANCELLED, BLOCKED_ENVIRONMENT, BLOCKED_CONTEXT, ERROR, STALE) — One completion state compatible with `bbk.review-attempt.v1`, with infrastructure and context blockers kept distinct from candidate assertion results.
- `durable_artifacts_and_handoff` (STRUCTURED) — Structured Validator result, ReviewAttempt-compatible record, EvidenceReceipts, findings, raw carriers, checkpoint and `bbk-handoff` references with exact subject, path, byte count, SHA-256, producer, attempt, creation time, verification and discovery path.
- `invalidation_and_supersession` (STRUCTURED) — Changes that invalidate the candidate, assignment, context, criterion, method, profile, tool, environment, consumer, device, evidence, independence or attempt; stale and superseded objects preserved; and any evidence eligible for reuse under an unchanged dependency closure.

Readiness rule:

`READY_FOR_ORCHESTRATOR_INTEGRATION` requires an exact current candidate and assignment; verified immutable subject and context; every assigned assertion represented by a current schema-valid status; required evidence and raw carriers bound or explicit non-evidence states recorded; actual independence and exposure reported; candidate defects represented by immutable findings and infrastructure failures kept separate; no unauthorized candidate mutation, hidden scope expansion, silent method substitution, unresolved identity or integrity ambiguity, or unaccounted external effect; cleanup sufficiently reconciled; and a verified durable result and handoff. It authorizes only Validator-Orchestrator integration of this one attempt.

Authority boundary:

No Validator return, including operational `COMPLETE`, assertion `PASS`, or `READY_FOR_ORCHESTRATOR_INTEGRATION`, can derive the complete ReviewAggregate, close or waive a finding, authorize repair, accept a candidate or residual risk, close an issue, complete a territory or campaign, establish outcome achievement, declare compliance, safety or security, or grant release.

Do not emit `READY_FOR_VALIDATION`, `BLOCKED`, or `PAUSED` as current operational dispositions; those values are consume-only legacy `bbk.handoff.v1` inputs.

