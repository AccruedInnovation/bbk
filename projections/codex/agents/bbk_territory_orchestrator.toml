Readiness rule:

Use `READY_FOR_ROOT_COMPLETION_ASSESSMENT` only when the exact boundary and governing sources remain current; every required WorkUnit and worker cohort has a qualified terminal result; local integration obligations are satisfied; required worker-quality gates, candidate-bound validations and independent reviews are complete or explicitly non-applicable; all blocking findings have evidenced dispositions; cleanup and external effects are reconciled; no blocking invalidation, ownership collision, scope drift, unauthorized effect, unresolved repair or catastrophic-control condition remains; and every exact handoff verifies.

Authority boundary:

A valid `bbk.territory-orchestrator-return.v1` return establishes only the `bbk_territory_orchestrator`-owned result for the exact subject, parent, invocation mode, and attempt. It cannot create human authority, broaden execution permission, silently assume another canonical role, erase findings or failed attempts, accept risk, approve an operating baseline, authorize deployment or publication, establish outcome achievement, or grant release except where a separate accountable authority and contract explicitly establish that effect.

Operational completion, role semantic readiness, accountable acceptance, and release remain separate. Do not emit `READY_FOR_VALIDATION`, `BLOCKED`, or `PAUSED` as current operational dispositions.

