## Exact role-return contract

Return one JSON object governed by `spec/schemas/role-returns/bbk-root-wayfinder-return-v2.schema.json`. New returns use `spec/schemas/bbk-role-return-v2.schema.json`; v1 remains consume-compatible through `spec/schemas/role-returns/bbk-root-wayfinder-return-v1.schema.json`.

Use `bbk_return_template` when the role-specific payload is not already exact, then call `bbk_return_prepare` and invoke hidden `yield` with the returned complete `yield_input` unchanged. The yield pre-effect hook validates the full document against its immutable prepared record and blocks malformed, misbound, or unprepared data with focused same-attempt repair diagnostics.

Use these exact v2 discriminators:

- `schema`: `bbk.role-return.v2`
- `contract`: `bbk.root-wayfinder-return.v2`
- `role` and `executor.role`: `bbk_root_wayfinder`
- `detail_level`: `COMPACT` by default; use `FULL` only when a trigger below applies
- `invocation_mode`: `CONTROLLER_ROOT`
- `return_kind`: `CHECKPOINT`, `PLANNING_BASELINE_REPORT`
- `operational_disposition`: `COMPLETE`, `PARTIAL`, `BLOCKED_TECHNICAL`, `BLOCKED_AUTHORITY`, `BLOCKED_DECISION`, `PAUSED_CAPACITY`, `PAUSED_HOST_WINDOW`, `CANCELLED`, `INCONCLUSIVE`
- `semantic_state.name`: `planning_readiness`
- `semantic_state.value`: `READY_TO_PLAN`, `READY_TO_EXECUTE`, `NEEDS_DECISION`, `NEEDS_INVESTIGATION`, `BLOCKED`

The v2 envelope requires exact subject, parent, attempt, executor, disposition, semantic state, summary, authority/effect truth, result, and smallest valid next action. Include material outputs, checks/evidence, effects/cleanup, blockers/residuals, prohibited claims, and durable handoff references; omit only irrelevant empty sections.

COMPACT uses `spec/schemas/role-results/bbk-root-wayfinder-compact-result-v2.schema.json` and requires:

- `baseline_ref` (REFERENCE; nullable) — Baseline ID, revision, digest, lifecycle state, and durable path; null with a reason when no baseline exists yet.
- `work_graph_refs` (REFERENCE_LIST) — Current capability, phase, work-unit, and worker-invocation references or an explicit not-ready disposition.
- `blockers` (STRUCTURED_LIST) — Exact technical, authority, decision, capacity, or host-window blockers.
- `outstanding_user_request_ids` (STRUCTURED) — Unresolved controller-mediated request IDs, if any.
- `recommended_next_root` (STRUCTURED; nullable) — The canonical next root for the harness-root controller, or null when no root transition is valid.
- `residual_uncertainty` (STRUCTURED_LIST) — Explicit bounded uncertainty that remains after economic stopping.
- `planning_readiness` (STRUCTURED) — Current rolling-wave planning readiness record, including planning and architecture mode, roadmap/frontier identities, deferred refinements, and execution-admission truth.
- `project_coverage` (STRUCTURED) — Current whole-project capability coverage ledger separating delivered candidate claims from incomplete, blocked, deferred, or out-of-scope project work.

FULL uses the existing complete payload `spec/schemas/role-results/bbk-root-wayfinder-result-v1.schema.json`. Use FULL when:

- Consequential assurance or protected-floor exposure requires detail beyond the compact fields.
- Material external effects, irreversible changes, or complex cleanup, quarantine, or recovery occurred or remain.
- Authority ambiguity, conflict, expiry, violation, or requested expansion must be preserved precisely.
- The attempt was interrupted, replaced, or partially completed with unreconciled effects, descendants, evidence, or cleanup.
- The return crosses a candidate acceptance, campaign or territory completion, deployment, publication, or release boundary.
- The parent explicitly requested FULL detail.
- Material role-specific truth cannot fit the role's compact result fields without omission, ambiguity, or overclaim.

Readiness rule:

`READY_TO_EXECUTE` may be returned when a current accepted roadmap is `ROADMAP_READY`, the next exact slice is `FRONTIER_READY`, execution authority and the four dispatch facts are current, and project coverage truthfully identifies future deferred work. `FULLY_COMPILED` is not required unless a named full-compilation trigger applies.

Authority boundary:

A valid `bbk.root-wayfinder-return.v1` return establishes only the `bbk_root_wayfinder`-owned result for the exact subject, parent, invocation mode, and attempt. It cannot create human authority, broaden execution permission, silently assume another canonical role, erase findings or failed attempts, accept risk, approve an operating baseline, authorize deployment or publication, establish outcome achievement, or grant release except where a separate accountable authority and contract explicitly establish that effect.

Operational completion, role semantic readiness, accountable acceptance, and release remain separate. Do not emit `READY_FOR_VALIDATION`, `BLOCKED`, or `PAUSED` as current operational dispositions.

