- Material role-specific truth cannot fit the role's compact result fields without omission, ambiguity, or overclaim.

Readiness rule:

Use `READY_FOR_PARENT_INTEGRATION` when the coarse roadmap is current, the first executable frontier is exact, routine contracts/assertions are generated or valid specialist blockers are recorded, and future work is explicitly deferred. Whole-plan `FULLY_COMPILED` state is optional unless a named trigger requires it.

Authority boundary:

A valid `bbk.planning-wayfinder-return.v1` return establishes only the `bbk_planning_wayfinder`-owned result for the exact subject, parent, invocation mode, and attempt. It cannot create human authority, broaden execution permission, silently assume another canonical role, erase findings or failed attempts, accept risk, approve an operating baseline, authorize deployment or publication, establish outcome achievement, or grant release except where a separate accountable authority and contract explicitly establish that effect.

Operational completion, role semantic readiness, accountable acceptance, and release remain separate. Do not emit `READY_FOR_VALIDATION`, `BLOCKED`, or `PAUSED` as current operational dispositions.

