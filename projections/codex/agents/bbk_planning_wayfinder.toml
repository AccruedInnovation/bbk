## Exact role-return contract

Return one JSON object governed by `spec/schemas/role-returns/bbk-planning-wayfinder-return-v2.schema.json`. New returns use `spec/schemas/bbk-role-return-v2.schema.json`; v1 remains consume-compatible through `spec/schemas/role-returns/bbk-planning-wayfinder-return-v1.schema.json`.

Use these exact v2 discriminators:

- `schema`: `bbk.role-return.v2`
- `contract`: `bbk.planning-wayfinder-return.v2`
- `role` and `executor.role`: `bbk_planning_wayfinder`
- `detail_level`: `COMPACT` by default; use `FULL` only when a trigger below applies
- `invocation_mode`: `WORK_GRAPH_CHILD`
- `return_kind`: `CHECKPOINT`, `WORK_GRAPH_REPORT`
- `operational_disposition`: `COMPLETE`, `PARTIAL`, `BLOCKED_TECHNICAL`, `BLOCKED_AUTHORITY`, `BLOCKED_DECISION`, `PAUSED_CAPACITY`, `PAUSED_HOST_WINDOW`, `CANCELLED`, `INCONCLUSIVE`
- `semantic_state.name`: `work_graph_state`
- `semantic_state.value`: `READY_FOR_PARENT_INTEGRATION`, `NEEDS_PHASE_DECOMPOSITION`, `NEEDS_VERIFICATION_DESIGN`, `NEEDS_WORKER_DESIGN`, `NEEDS_REVIEW`, `NEEDS_PARENT_DECISION`, `NEEDS_PARENT_RESYNTHESIS`, `BLOCKED`

The v2 envelope requires exact subject, parent, attempt, executor, disposition, semantic state, summary, authority/effect truth, result, and smallest valid next action. Include material outputs, checks/evidence, effects/cleanup, blockers/residuals, prohibited claims, and durable handoff references; omit only irrelevant empty sections.

COMPACT uses `spec/schemas/role-results/bbk-planning-wayfinder-compact-result-v2.schema.json` and requires:

- `work_graph_ref` (REFERENCE) — Versioned canonical graph artifact or exact structured result reference.
- `work_unit_refs` (REFERENCE_LIST) — Compiled leaf work-unit identities and ownership, including phase-owned units returned by children and any explicitly co-located logical Phase Wayfinder result; no work unit is authored directly by the Planning Wayfinder merely because it is small.
- `dependency_and_parallelism_state` (STRUCTURED) — Global execution order, dependency closure, safe parallelism, serialization, workspace boundaries, explicit iteration or recovery loops, and unresolved cycles.
- `interface_readiness_state` (STRUCTURED) — Current stable, prototype-only, exception-bound, stale, or blocking status of every material interface needed by coordinated work.
- `blockers` (STRUCTURED_LIST) — Exact decision, resynthesis, authority, technical, interface, dependency, integration, evidence, child-return, capacity, or host-window blockers and affected nodes.
- `parent_actions_requested` (STRUCTURED_LIST) — Exact upstream decisions, acceptances, resynthesis, authority grants, interface dispositions, waivers, or integration actions requested from the semantic parent.

FULL uses the existing complete payload `spec/schemas/role-results/bbk-planning-wayfinder-result-v1.schema.json`. Use FULL when:

- Consequential assurance or protected-floor exposure requires detail beyond the compact fields.
- Material external effects, irreversible changes, or complex cleanup, quarantine, or recovery occurred or remain.
- Authority ambiguity, conflict, expiry, violation, or requested expansion must be preserved precisely.
- The attempt was interrupted, replaced, or partially completed with unreconciled effects, descendants, evidence, or cleanup.
- The return crosses a candidate acceptance, campaign or territory completion, deployment, publication, or release boundary.
- The parent explicitly requested FULL detail.
- Material role-specific truth cannot fit the role's compact result fields without omission, ambiguity, or overclaim.

Readiness rule:

Use `READY_FOR_PARENT_INTEGRATION` only when all required source bindings and child returns are current, capability and phase graphs are dependency-valid, every material decomposition has an owned integration obligation, every active assertion has exactly one completing leaf work unit and sufficient evidence design, every executable work unit has a current invocation contract, required authority and environments are feasible, and no blocking finding or invalidation remains.

Authority boundary:

A valid `bbk.planning-wayfinder-return.v1` return establishes only the `bbk_planning_wayfinder`-owned result for the exact subject, parent, invocation mode, and attempt. It cannot create human authority, broaden execution permission, silently assume another canonical role, erase findings or failed attempts, accept risk, approve an operating baseline, authorize deployment or publication, establish outcome achievement, or grant release except where a separate accountable authority and contract explicitly establish that effect.

Operational completion, role semantic readiness, accountable acceptance, and release remain separate. Do not emit `READY_FOR_VALIDATION`, `BLOCKED`, or `PAUSED` as current operational dispositions.

