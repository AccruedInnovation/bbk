name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source repository
        run: python tools/verify_source_repository.py --require-node

  windows-portability:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical and generated surfaces
        shell: pwsh
        run: |
          python tools/create_method_content.py --check
          python tools/create_role_spec.py --check
          python tools/model_routing.py --check
          python tools/generate_agents.py --check
          python tools/source_sanity.py
          node --check omp/extension/index.js
